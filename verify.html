<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a results slip | Toase Snr High School</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f1f4fa; --card:#ffffff; --ink:#0f2547; --muted:#51627f; --line:#d3dbea;
    --brand:#1d4f9f; --brand-dark:#123a78; --on-brand:#ffffff; --gold:#d9a514;
    --good:#14663f; --fail:#a3262a; --focus:#1a6fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0b1424; --card:#121f36; --ink:#e7eefb; --muted:#9fb1d0; --line:#26395c;
      --brand:#6aa6f0; --brand-dark:#8dbcf5; --on-brand:#06101f; --gold:#f0c23d;
      --good:#5cc19b; --fail:#ef7276; --focus:#8ec1ff;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height:100vh; }
  .wrap { max-width:460px; margin:0 auto; padding:18px 16px 40px; }
  header.school { display:flex; align-items:center; gap:12px; padding:4px 2px 16px;
    border-bottom:3px solid var(--gold); margin-bottom:16px; }
  header.school img { width:64px; height:64px; border-radius:10px; object-fit:cover; flex:none; }
  header.school .name { font-family:"Newsreader", Georgia, serif; font-weight:700; font-size:1.3rem;
    line-height:1.2; color:var(--brand-dark); margin:0; }
  header.school .sub { margin:3px 0 0; color:var(--muted); font-size:.86rem; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 18px 22px; }
  .panel h1 { font-family:"Newsreader", Georgia, serif; font-size:1.45rem; margin:0 0 4px; line-height:1.25; }
  .lead { margin:0 0 14px; color:var(--muted); font-size:.95rem; }
  label { display:block; font-weight:600; font-size:.92rem; margin:14px 0 6px; }
  input { width:100%; font:inherit; padding:12px; border:1.5px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font-family:ui-monospace, Menlo, Consolas, monospace;
    letter-spacing:.06em; text-transform:uppercase; }
  input:focus-visible, button:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:13px 16px; font-weight:600;
    width:100%; margin-top:16px; background:var(--brand); color:var(--on-brand); }
  button:disabled { opacity:.65; cursor:wait; }
  .result { margin-top:18px; padding:14px; border-radius:8px; border-left:5px solid var(--line); }
  .result.ok { border-left-color:var(--good); background:color-mix(in srgb, var(--good) 10%, var(--card)); }
  .result.bad { border-left-color:var(--fail); background:color-mix(in srgb, var(--fail) 10%, var(--card)); }
  .result h2 { margin:0 0 8px; font-size:1.1rem; }
  .result.ok h2 { color:var(--good); }
  .result.bad h2 { color:var(--fail); }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:.94rem; }
  dt { color:var(--muted); }
  dd { margin:0; font-weight:500; overflow-wrap:anywhere; }
  .fine { color:var(--muted); font-size:.82rem; margin:12px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="school">
    <img src="logo.jpg" alt="School logo">
    <div>
      <p class="name">Toase Snr High School</p>
      <p class="sub">Results slip verification</p>
    </div>
  </header>

  <main class="panel">
    <h1>Verify a results slip</h1>
    <p class="lead">Scan the QR code on the slip, or type the reference number printed under it.</p>
    <form id="vForm" novalidate autocomplete="off">
      <label for="ref">Reference number</label>
      <input id="ref" type="text" maxlength="40" placeholder="TOA-2026-XXXXXXXX" autocapitalize="characters">
      <button id="vBtn" type="submit">Verify slip</button>
    </form>
    <div id="out" class="result" role="status" aria-live="polite" hidden></div>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://uzrejoihtqgjigywymlj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5xu7TIwtCoa3Fo2BNZwnJw_EB9yFHQl";
  const $ = (id) => document.getElementById(id);

  function row(dl, label, value) {
    if (!value) return;
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd"); dd.textContent = value;
    dl.append(dt, dd);
  }

  function show(kind, title, data) {
    const out = $("out");
    out.className = "result " + kind;
    out.textContent = "";
    const h = document.createElement("h2"); h.textContent = title; out.append(h);
    if (data) {
      const dl = document.createElement("dl");
      row(dl, "Student", data.full_name);
      row(dl, "Index number", data.index_number);
      row(dl, "Exam", data.exam_type);
      row(dl, "Year", data.exam_year);
      row(dl, "Semester", data.semester);
      row(dl, "School", data.school_name);
      if (data.issued_on) {
        row(dl, "Issued", new Date(data.issued_on).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }));
      }
      out.append(dl);
      const p = document.createElement("p"); p.className = "fine";
      p.textContent = "Compare these details with the printed slip. Scores are not shown here.";
      out.append(p);
    } else {
      const p = document.createElement("p"); p.className = "fine";
      p.textContent = "Check the reference number and try again. If it still fails, the slip may not be genuine.";
      out.append(p);
    }
    out.hidden = false;
  }

  async function verify(ref) {
    const btn = $("vBtn");
    btn.disabled = true; btn.textContent = "Checking...";
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/verify_slip", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_ref: ref }),
      });
      const data = await res.json().catch(() => null);
      if (res.ok && data && data.ok) show("ok", "Valid slip, issued by Toase Snr High School", data);
      else show("bad", "Slip not found");
    } catch (e) {
      show("bad", "Network problem. Check your internet and try again.");
    } finally {
      btn.disabled = false; btn.textContent = "Verify slip";
    }
  }

  $("vForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const ref = $("ref").value.trim().toUpperCase();
    if (ref.length < 6) { show("bad", "Enter the full reference number"); return; }
    verify(ref);
  });

  const fromLink = new URLSearchParams(location.search).get("ref");
  if (fromLink) { $("ref").value = fromLink.toUpperCase(); verify(fromLink.trim().toUpperCase()); }
</script>
</body>
</html>
