<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Results portal</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#f1f4fa; color:#0f2547; display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:20px; }
  @media (prefers-color-scheme: dark) { body { background:#0b1424; color:#e7eefb; } }
  a { color:#1d4f9f; }
  @media (prefers-color-scheme: dark) { a { color:#8dbcf5; } }
</style>
</head>
<body>
<p id="msg">Opening your school's page...</p>
<script>
  /* A short address like  /nyinahin  opens that school's results page,
     and  /nyinahin/admin  opens its admin page. No new file is needed for a new school. */
  (function () {
    var base = /\.github\.io$/.test(location.hostname) ? "/toase-results/" : "/";
    var path = location.pathname;
    if (path.indexOf(base) !== 0) { base = "/"; }
    var parts = path.slice(base.length).split("/").filter(Boolean);
    var slug = (parts[0] || "").toLowerCase();
    if (/^[a-z][a-z0-9-]{2,29}$/.test(slug) && (parts.length === 1 || (parts.length === 2 && parts[1].toLowerCase() === "admin"))) {
      var admin = parts.length === 2;
      location.replace(base + (admin ? "portal-admin.html" : "") + "?school=" + encodeURIComponent(slug));
      return;
    }
    document.getElementById("msg").innerHTML = 'Page not found. <a href="' + base + '">Go to the results page</a>';
  })();
</script>
</body>
</html>
